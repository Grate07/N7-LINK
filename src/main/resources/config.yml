# N7-Link Configuration

# Linking code settings
link:
  code-length: 6
  code-expiry-minutes: 5

# Linking rewards
rewards:
  enabled: true

  # Commands executed when a player successfully links Discord.
  # %player% = Minecraft username
  # %uuid% = Minecraft UUID
  commands:
    - "give %player% diamond 5"
    # - "eco give %player% 10000"
    # - "lp user %player% parent add linked"

  # Message sent to the player after linking
  message: "&aThanks for linking your Discord account!"

# Discord settings
discord:
  enabled: true

# API settings
api:
  url: ""
  secret: ""
